<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Blog | Vanshi Sethi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #FDF9F6; --bg-secondary: #F5EFEB; --text-primary: #2D2321;
    --text-secondary: #6B5B57; --accent: #D86344;
    --border-color: #EEDFD6; --card-bg: #FFFFFF;
    --nav-bg: rgba(253, 249, 246, 0.85); --font-display: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
  }
  body.dark-mode {
    --bg-primary: #1A1615; --bg-secondary: #241F1E; --text-primary: #F7EFEA;
    --text-secondary: #BFAFA9; --accent: #F4A261;
    --border-color: #362D2B; --card-bg: #211C1B;
    --nav-bg: rgba(26, 22, 21, 0.85);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); transition: all 0.5s ease; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh;}
  a { text-decoration: none; color: inherit; }
  
  nav { position: fixed; top: 0; width: 100%; z-index: 50; background: var(--nav-bg); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); }
  .nav-inner { max-width: 1040px; margin: 0 auto; padding: 16px 5vw; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--text-primary); }
  .nav-brand span { color: var(--accent); }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .tab { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); padding: 8px 18px; border-radius: 99px; transition: all 0.2s ease; }
  .tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
  .tab.active { color: var(--accent); background: rgba(216, 99, 68, 0.12); font-weight: 600; }
  .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 16px; transition: all 0.3s ease; }

  /* Center the Coming Soon content */
  .center-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 5vw; text-align: center; }
  .blog-icon { font-size: 4rem; margin-bottom: 24px; animation: float 6s ease-in-out infinite; }
  .center-content h1 { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 4.5rem); margin-bottom: 16px; }
  .center-content p { font-size: 1.15rem; color: var(--text-secondary); max-width: 500px; line-height: 1.6; }

  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  
  .anim-item { opacity: 0; transform: translateY(20px); transition: all 0.8s ease; }
  .in .anim-item { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-brand"><a href="index.html">vanshi<span>.sethi</span></a></div>
    <div class="nav-links">
      <a href="index.html" class="tab">Profile</a>
      <a href="certificates.html" class="tab">Certificates</a>
      <a href="gallery.html" class="tab">Gallery</a>
      <a href="blog.html" class="tab active">Blog</a>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg id="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>
</nav>

<div class="center-content anim-container">
  <div class="blog-icon anim-item" style="transition-delay: 0.1s;">✍️</div>
  <h1 class="anim-item" style="transition-delay: 0.2s;">Coming Soon</h1>
  <p class="anim-item" style="transition-delay: 0.3s;">I am currently setting up my digital space to write about Explainable AI, computer vision architectures, and deep learning engineering.</p>
</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const sunIcon = document.getElementById('sun-icon');
  const moonIcon = document.getElementById('moon-icon');
  function applyThemeState(isDark) {
    if (isDark) { document.body.classList.add('dark-mode'); sunIcon.style.display = 'block'; moonIcon.style.display = 'none'; } 
    else { document.body.classList.remove('dark-mode'); sunIcon.style.display = 'none'; moonIcon.style.display = 'block'; }
  }
  const savedTheme = localStorage.getItem('portfolio_theme');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) { applyThemeState(true); } else { applyThemeState(false); }
  themeToggle.addEventListener('click', () => {
    const willBeDark = !document.body.classList.contains('dark-mode');
    applyThemeState(willBeDark); localStorage.setItem('portfolio_theme', willBeDark ? 'dark' : 'light');
  });
  setTimeout(() => document.querySelector('.anim-container').classList.add('in'), 100);
</script>
</body>
</html>
